<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body class="bg-black flex items-center justify-center h-screen font-sans">
  <div class="relative p-8 rounded-2xl neon-border w-[350px]">
    <h2 class="text-cyan-400 text-center text-3xl font-bold mb-6">Tech Login</h2>
    <input type="text" placeholder="Username" class="w-full mb-4 px-4 py-2 bg-gray-800 text-white rounded focus:outline-none focus:ring-2 focus:ring-cyan-400">
    <input type="password" placeholder="Password" class="w-full mb-6 px-4 py-2 bg-gray-800 text-white rounded focus:outline-none focus:ring-2 focus:ring-cyan-400">
    <button onclick="handleLogin()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded transition-all">Log In</button>
    <div class="absolute bottom-0 left-0 w-full h-1 bg-cyan-400 animate-pulse"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
